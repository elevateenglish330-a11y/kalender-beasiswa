/* Layout: a wall calendar for deadlines. Month grid on top, the selected day's dossier underneath; an agenda view for scanning across months. */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9ECF1; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#DFE4EC;
  --ink:#0E1626; --ink-2:#4C5A70; --ink-3:#78869A;
  --line:#D3DAE4; --line-strong:#B6C0CE;
  --accent:#8A5E05; --accent-bright:#F0B01E;
  --urgent:#A82A1F; --urgent-bg:#FAE7E4;
  --soon:#845A05; --soon-bg:#FBF1D9;
  --open:#15654A; --open-bg:#E0F1EA;
  --closed:#66748A; --closed-bg:#E7EBF1;
  --r-uk:#1E4FA3; --r-eropa:#6A3FA0; --r-amerika:#B0302F; --r-oseania:#0D7A72;
  --r-asiatimur:#C25C0A; --r-asiatenggara:#2E7D32; --r-turki:#B52A5B; --r-indonesia:#9A7000;
  --brand:#1B3B8B; --brand-2:#F0B01E; --teal:#0E9E9B; --lime:#5E8C00; --ungu:#8E3FAE;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111C; --surface:#141C2B; --surface-2:#1B2434; --surface-3:#222D40;
    --ink:#E7ECF4; --ink-2:#9AA8BD; --ink-3:#73819A;
    --line:#283347; --line-strong:#3A4761;
    --accent:#F0B01E; --accent-bright:#F0B01E;
    --urgent:#FF8276; --urgent-bg:#381916;
    --soon:#F0B01E; --soon-bg:#312509;
    --open:#4FD7A0; --open-bg:#0F271E;
    --closed:#8695AB; --closed-bg:#1A2231;
    --r-uk:#84ACF2; --r-eropa:#BD9BEC; --r-amerika:#FF9089; --r-oseania:#4FD3C7;
    --r-asiatimur:#FFA85C; --r-asiatenggara:#74D882; --r-turki:#FF8CB4; --r-indonesia:#EBC452;
    --brand:#7FA8F0; --brand-2:#F0B01E; --teal:#44D2CF; --lime:#A8DB3C; --ungu:#C58BE0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111C; --surface:#141C2B; --surface-2:#1B2434; --surface-3:#222D40;
  --ink:#E7ECF4; --ink-2:#9AA8BD; --ink-3:#73819A;
  --line:#283347; --line-strong:#3A4761;
  --accent:#F0B01E; --accent-bright:#F0B01E;
  --urgent:#FF8276; --urgent-bg:#381916;
  --soon:#F0B01E; --soon-bg:#312509;
  --open:#4FD7A0; --open-bg:#0F271E;
  --closed:#8695AB; --closed-bg:#1A2231;
  --r-uk:#84ACF2; --r-eropa:#BD9BEC; --r-amerika:#FF9089; --r-oseania:#4FD3C7;
  --r-asiatimur:#FFA85C; --r-asiatenggara:#74D882; --r-turki:#FF8CB4; --r-indonesia:#EBC452;
  --brand:#7FA8F0; --brand-2:#F0B01E; --teal:#44D2CF; --lime:#A8DB3C; --ungu:#C58BE0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:inherit}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.mast-l{min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
h1{font-family:var(--font-display);font-size:clamp(32px,8vw,46px);font-weight:700;letter-spacing:-.015em;line-height:1}
.strap{font-family:var(--font-display);font-size:clamp(12.5px,3vw,16px);font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin:8px 0 0;line-height:1.2}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:8px;max-width:48ch}
.mast-r{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.stamp{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:2px;padding:5px 9px;background:var(--surface);white-space:nowrap}
.stamp b{color:var(--ink);font-weight:600}

.alert{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding:12px 14px;background:var(--urgent-bg);border-left:3px solid var(--urgent);border-radius:0 3px 3px 0}
.alert-k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--urgent);font-weight:600;padding-top:1px;white-space:nowrap}
.alert-t{font-size:13.5px;min-width:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:18px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat-n{font-family:var(--font-mono);font-size:25px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--ink-2);margin-top:5px;line-height:1.3}

.views{display:flex;gap:6px;margin-top:20px}
.vbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:3px;padding:7px 15px;font-size:13px}
.vbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}

.cal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.calnav{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.calnav h2{font-family:var(--font-display);font-size:20px;font-weight:600;flex:1;min-width:0}
.nbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:3px;width:30px;height:30px;line-height:1;padding:0;font-size:15px;display:grid;place-items:center}
.nbtn.wide{width:auto;padding:0 11px;font-size:12.5px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border-bottom:1px solid var(--line)}
.dow span{background:var(--surface-2);text-align:center;padding:7px 2px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line)}
.cell{background:var(--surface);min-height:86px;padding:5px 5px 6px;text-align:left;border:0;display:flex;flex-direction:column;gap:3px;min-width:0;color:inherit;font:inherit}
.cell.pad{background:var(--surface-2)}
.cell.has{cursor:pointer}
.cell:not(.has){cursor:default}
.cell.sel{background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--ink)}
.dnum{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);line-height:1.4;flex:0 0 auto}
.cell.today .dnum{background:var(--ink);color:var(--bg);border-radius:999px;width:21px;height:21px;display:grid;place-items:center;font-weight:600}
.cell.wk .dnum{color:var(--ink-3)}
.ev{display:block;width:100%;font-size:10.5px;line-height:1.25;padding:2px 4px;border-radius:2px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border-left:2px solid currentColor}
.ev.lebih{background:var(--closed-bg);color:var(--closed);border-left-color:var(--closed)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor}
.months{display:flex;flex-wrap:wrap;gap:6px;padding:11px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.months b{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);align-self:center;margin-right:2px}
.mjump{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:11.5px;font-family:var(--font-mono)}
.mjump[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.detail{margin-top:14px}
.dhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.dhead h3{font-family:var(--font-display);font-size:19px;font-weight:600}
.dhead span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}

.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 15px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stripe{background:var(--closed)}
.body{padding:14px 0;min-width:0}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.ttl h3{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.15}
.org{font-size:12px;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-strong);color:var(--ink-2);border-radius:2px;padding:2px 6px;background:var(--surface-2)}
.tag.est{border-style:dashed;border-color:var(--soon);color:var(--soon);background:var(--soon-bg)}
.tag.penuh{border-color:var(--open);color:var(--open);background:var(--open-bg);font-weight:600}
.tag.parsial{border-color:var(--closed);color:var(--closed);background:var(--closed-bg);font-weight:600}
.dates{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:11px;font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.dates b{color:var(--ink);font-weight:500}
.syarat{margin:12px 0 0;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px}
.syarat h4{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.syarat ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:4px}
.syarat li{font-size:13px;color:var(--ink-2)}
.syarat p{margin:8px 0 0;font-size:11.5px;color:var(--ink-3);font-style:italic}
.note{font-size:13px;color:var(--ink-2);margin:10px 0 0;max-width:62ch}
.lnk{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:500;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.cd{padding:14px 15px 14px 0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}
.cd-n{font-family:var(--font-mono);font-size:29px;font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--closed)}
.row.s-urgent .cd-n{color:var(--urgent)}
.row.s-soon .cd-n{color:var(--soon)}
.row.s-open .cd-n{color:var(--open)}
.cd-u{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pill{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;border-radius:2px;padding:3px 7px;background:var(--closed-bg);color:var(--closed)}
.row.s-urgent .pill{background:var(--urgent-bg);color:var(--urgent)}
.row.s-soon .pill{background:var(--soon-bg);color:var(--soon)}
.row.s-open .pill{background:var(--open-bg);color:var(--open)}
.row.closed{opacity:.62}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:4px;background:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:12.5px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.sep{width:1px;background:var(--line-strong);margin-inline:4px;align-self:stretch}

.ebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px}
.ebar p{margin:0;font-size:12.5px;color:var(--ink-2);flex:1;min-width:180px}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.dgr{color:var(--urgent);border-color:var(--urgent)}
.rowacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.form{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:16px;margin-top:12px}
.form h3{font-family:var(--font-display);font-size:17px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:13.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);border-radius:3px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:62px}
.hint{font-size:11.5px;color:var(--ink-3);margin:12px 0 0}
.formacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.toast{margin-top:12px;padding:10px 13px;border-radius:3px;font-size:13px;border-left:3px solid var(--accent);background:var(--soon-bg)}
.toast.bad{border-left-color:var(--urgent);background:var(--urgent-bg)}
.toast.good{border-left-color:var(--open);background:var(--open-bg)}
.jsonbox{margin-top:12px}
.jsonbox textarea{width:100%;min-height:150px;font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);border-radius:3px;padding:9px}

.foot{margin-top:36px;padding-top:20px;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
.foot-l{min-width:0;max-width:46ch}
.foot h2{font-family:var(--font-display);font-size:19px;font-weight:600}
.foot p{margin:7px 0 0;font-size:13px;color:var(--ink-2)}
.contact{display:flex;flex-direction:column;gap:7px}
.cline{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.cline b{color:var(--ink);font-weight:500}
.disc{margin-top:24px;font-size:11.5px;color:var(--ink-3);line-height:1.55;max-width:70ch}
.boot{padding:50px 18px;text-align:center;color:var(--ink-3);font-family:var(--font-mono);font-size:12.5px}

/* warna region */
.r-uk{--region:var(--r-uk)} .r-eropa{--region:var(--r-eropa)} .r-amerika{--region:var(--r-amerika)}
.r-oseania{--region:var(--r-oseania)} .r-asiatimur{--region:var(--r-asiatimur)}
.r-asiatenggara{--region:var(--r-asiatenggara)} .r-turki{--region:var(--r-turki)}
.r-indonesia{--region:var(--r-indonesia)} .r-lain{--region:var(--ink-3)}
.row .stripe{background:var(--region,var(--closed))}
.tag.neg{border-color:var(--region);color:var(--region);background:color-mix(in srgb,var(--region) 10%,transparent);font-weight:600}
.ev{border-left:3px solid var(--urg,var(--region));background:color-mix(in srgb,var(--region) 14%,var(--surface));color:var(--region);font-weight:500}
.ev.u-urgent{--urg:var(--urgent)} .ev.u-soon{--urg:var(--soon)} .ev.u-open{--urg:var(--open)}
.ev.u-closed{--urg:var(--closed);opacity:.55} .ev.u-nanti{--urg:var(--line-strong)}
.ev.buka{background:none;color:var(--ink-3);border-left-style:dotted}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);font-family:var(--font-mono)}
.lg i{width:9px;height:9px;border-radius:2px;background:var(--region);display:inline-block}

/* peta */
.map{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mapwrap{padding:16px 12px 10px;background:linear-gradient(170deg,var(--surface-2),var(--surface))}
.mapwrap svg{display:block;width:100%;height:auto;overflow:visible}
.grat{stroke:var(--line);stroke-width:.25;fill:none}
.eqline{stroke:var(--line-strong);stroke-width:.4;stroke-dasharray:2 2}
.contlbl{fill:var(--ink-3);font-size:3.6px;letter-spacing:.9px;font-family:var(--font-mono);text-transform:uppercase}
.bub{fill:var(--region);fill-opacity:.7;stroke:var(--surface);stroke-width:.7;cursor:pointer;transition:fill-opacity .12s}
.bub:hover{fill-opacity:1}
.bub.on{fill-opacity:1;stroke:var(--ink);stroke-width:1.4}
.bub.mati{fill:var(--closed);fill-opacity:.3}
.bubn{fill:#fff;font-size:3.4px;font-family:var(--font-mono);font-weight:600;text-anchor:middle;pointer-events:none}
.bubl{fill:var(--ink);font-size:3.6px;font-family:var(--font-mono);text-anchor:middle;pointer-events:none}
.mapkey{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 14px 12px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.negs{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.neg{background:var(--surface);padding:10px 12px;text-align:left;border:0;border-left:3px solid var(--region,var(--line));color:inherit;font:inherit;cursor:pointer;min-width:0}
.neg:hover{background:var(--surface-2)}
.neg[aria-pressed="true"]{background:var(--surface-3)}
.neg b{display:block;font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neg span{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.neg em{font-style:normal;color:var(--open);font-weight:600}
.mapsel{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;margin-top:16px}
.mapsel h3{font-family:var(--font-display);font-size:19px;font-weight:600}
.mapsel span{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.mapsel button{margin-left:auto}

/* aksen masthead */
.rule{height:5px;border-radius:3px;margin-top:14px;background:linear-gradient(90deg,var(--r-uk),var(--r-eropa),var(--r-turki),var(--r-amerika),var(--r-asiatimur),var(--r-asiatenggara),var(--r-oseania),var(--r-indonesia))}
.stat:nth-child(1){border-top:3px solid var(--open)}
.stat:nth-child(2){border-top:3px solid var(--soon)}

/* promo */
.promo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding:12px 15px;border-radius:5px;
  background:linear-gradient(100deg,var(--brand),var(--ungu));color:#fff;border:0}
.promo b{font-family:var(--font-display);font-size:17px;letter-spacing:.01em}
.promo span{font-size:13px;opacity:.95}
.promo .sisa{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--brand-2);color:#1a1300;
  padding:4px 10px;border-radius:999px;font-weight:600;white-space:nowrap}

/* penawaran */
.sell{margin-top:40px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sell-top{padding:24px 20px;background:linear-gradient(135deg,var(--brand) 0%,#102456 100%);color:#fff}
.sell-top h2{font-family:var(--font-display);font-size:clamp(21px,4.6vw,29px);font-weight:700;line-height:1.15;max-width:22ch}
.sell-top h2 em{font-style:normal;color:var(--brand-2)}
.sell-top p{margin:10px 0 0;font-size:13.5px;opacity:.92;max-width:52ch}
.sell-poin{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.sell-poin li{font-size:13px;padding-left:22px;position:relative;opacity:.96}
.sell-poin li::before{content:"";position:absolute;left:0;top:7px;width:10px;height:10px;border-radius:2px;background:var(--brand-2)}
.demo{display:inline-block;margin-top:16px;background:var(--brand-2);color:#1a1300;font-weight:700;
  font-family:var(--font-display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:7px 14px;border-radius:3px}
.paket{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line)}
.pk{background:var(--surface);padding:0 0 18px;display:flex;flex-direction:column;min-width:0}
.pk-h{padding:11px 16px;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;background:var(--pkc);color:#0c1220}
.pk.teal{--pkc:var(--teal)} .pk.lime{--pkc:var(--lime)} .pk.ungu{--pkc:var(--ungu)}
.pk-harga{padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.pk-harga b{font-family:var(--font-mono);font-size:23px;font-weight:600;letter-spacing:-.02em}
.pk-harga s{font-family:var(--font-mono);font-size:13px;color:var(--urgent);text-decoration-thickness:2px}
.pk-per{padding:3px 16px 0;font-size:11.5px;color:var(--ink-3);font-family:var(--font-mono)}
.pk ul{margin:13px 0 0;padding:0 16px 0 32px;display:grid;gap:6px}
.pk li{font-size:12.8px;color:var(--ink-2)}
.pk .best{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  background:#0c1220;color:var(--brand-2);padding:2px 7px;border-radius:999px;margin-left:7px;vertical-align:2px}
.sell-cta{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);background:var(--surface-2)}
.sell-cta p{margin:0;font-size:13px;color:var(--ink-2);max-width:40ch}
.wa{display:inline-flex;align-items:center;gap:9px;background:#1FA855;color:#fff;text-decoration:none;
  font-weight:600;font-size:15px;padding:12px 22px;border-radius:5px;white-space:nowrap}
.wa svg{width:19px;height:19px;fill:currentColor;flex:0 0 auto}
.wa-num{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);margin-top:7px}
.wa-num b{color:var(--ink);font-weight:500}

@media (max-width:640px){
  .sell-cta{flex-direction:column;align-items:stretch}
  .wa{justify-content:center}
  .promo .sisa{margin-left:0}
  .cell{min-height:62px;padding:4px 3px 5px}
  .ev{display:none}
  .dots{display:flex}
  .stats{grid-template-columns:1fr}
  .row{grid-template-columns:4px 1fr}
  .cd{grid-column:2;padding:0 15px 14px 0;flex-direction:row;align-items:baseline;gap:9px}
  .cd-n{font-size:23px}
  .body{padding-bottom:11px}
  .calnav h2{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="boot">Memuat data beasiswa...</div></div>
<script>
(function(){
  "use strict";

  var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var BLN_PENDEK = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var DOW = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
  var JENJANG = ["S1","S2","S3"];

  var state = null;
  var app = document.getElementById("app");
  var canWrite = location.hash.indexOf("edit") > -1;
  var editing = false, dirty = false;
  var formFor = null, toast = null, showJson = false;
  var view = "kalender";
  var filterStatus = "aktif", filterJenjang = "semua", filterDana = "semua";
  var mapNegara = null;
  var curY, curM, selected = null;

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function valid(s){ return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function days(a, b){
    if (!valid(a) || !valid(b)) return null;
    return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
  }
  function fmt(iso, presisi){
    if (!valid(iso)) return "belum ada";
    var p = iso.split("-"), bln = BULAN[parseInt(p[1],10) - 1];
    return presisi === "bulan" ? bln + " " + p[0] : parseInt(p[2],10) + " " + bln + " " + p[0];
  }
  var TODAY = todayISO();

  function statusOf(it){
    var dt = days(TODAY, it.tutup), db = days(TODAY, it.buka);
    if (dt !== null && dt < 0) return "tutup";
    if (db !== null && db > 0) return "nanti";
    return "buka";
  }
  function urgensi(it){
    var s = statusOf(it);
    if (s === "tutup") return "closed";
    if (s === "nanti") return "nanti";
    var d = days(TODAY, it.tutup);
    if (d === null) return "open";
    if (d <= 7) return "urgent";
    if (d <= 30) return "soon";
    return "open";
  }
  function kelasRow(it){ var u = urgensi(it); return u === "closed" ? "closed" : "s-" + u; }
  function urutan(it){
    var s = statusOf(it), dt = days(TODAY, it.tutup), db = days(TODAY, it.buka);
    if (s === "buka") return [0, dt === null ? 99999 : dt];
    if (s === "nanti") return [1, db === null ? 99999 : db];
    return [2, dt === null ? 99999 : -dt];
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function safeUrl(u){ return (typeof u === "string" && /^https:\/\//i.test(u)) ? u : ""; }

  function eventMap(){
    var m = {};
    state.items.forEach(function(it){
      if (valid(it.tutup)) (m[it.tutup] = m[it.tutup] || []).push({ it: it, tipe: "tutup" });
      if (valid(it.buka))  (m[it.buka]  = m[it.buka]  || []).push({ it: it, tipe: "buka"  });
    });
    return m;
  }
  function defaultSelection(){
    var buka = state.items.filter(function(i){ return statusOf(i) === "buka" && valid(i.tutup); })
      .sort(function(a,b){ return days(TODAY,a.tutup) - days(TODAY,b.tutup); });
    if (buka.length) return buka[0].tutup;
    var next = state.items.filter(function(i){ return valid(i.tutup) && days(TODAY,i.tutup) >= 0; })
      .sort(function(a,b){ return days(TODAY,a.tutup) - days(TODAY,b.tutup); });
    return next.length ? next[0].tutup : TODAY;
  }

  function render(){
    if (!state) return;
    var evs = eventMap();
    var items = state.items.slice().sort(function(a,b){
      var x = urutan(a), y = urutan(b); return x[0]-y[0] || x[1]-y[1];
    });
    var buka = items.filter(function(i){ return statusOf(i) === "buka"; });
    var mendesak = buka.filter(function(i){ var d = days(TODAY,i.tutup); return d !== null && d <= 30; });
    var nanti = items.filter(function(i){ return statusOf(i) === "nanti"; });
    var paling = buka[0] || null;
    var palingN = paling ? days(TODAY, paling.tutup) : null;

    var h = "";
    h += '<header class="mast"><div class="mast-l">'
      + '<div class="eyebrow">Dipantau oleh ' + esc(state.kontak.nama) + '</div>'
      + '<h1>Kalender Beasiswa</h1>'
      + '<p class="strap">Terupdate dan Terlengkap</p>'
      + '<p class="sub">Tenggat pendaftaran beasiswa luar negeri untuk pelamar Indonesia. Klik tanggal untuk melihat syaratnya.</p>'
      + '</div><div class="mast-r">'
      + '<div class="stamp">Diperbarui <b>' + esc(fmt(state.updated,"hari")) + '</b></div>'
      + '<div class="stamp">Hari ini <b class="mono">' + esc(fmt(TODAY,"hari")) + '</b></div>'
      + '</div></header><div class="rule"></div>';

    if (paling && palingN !== null && palingN <= 14) {
      h += '<div class="alert"><div class="alert-k">' + (palingN <= 0 ? "Hari ini" : palingN + " hari lagi") + '</div>'
        + '<div class="alert-t"><b>' + esc(paling.nama) + '</b> tutup ' + esc(fmt(paling.tutup, paling.presisi))
        + (paling.jam ? ", pukul " + esc(paling.jam) : "") + '.</div></div>';
    }

    h += promoHtml();

    h += '<div class="stats">'
      + '<div class="stat"><div class="stat-n">' + buka.length + '</div><div class="stat-l">sedang dibuka</div></div>'
      + '<div class="stat"><div class="stat-n">' + mendesak.length + '</div><div class="stat-l">tutup dalam 30 hari</div></div>'
      + '<div class="stat"><div class="stat-n">' + nanti.length + '</div><div class="stat-l">menunggu dibuka</div></div>'
      + '</div>';

    if (canWrite) {
      h += '<div class="ebar"><p>' + (editing
          ? (dirty ? "Ada perubahan. Klik Salin data.json lalu tempel ke GitHub supaya publik melihatnya." : "Mode edit aktif. Hanya kamu yang melihat panel ini, karena alamatnya diakhiri #edit.")
          : "Mode edit tersedia. Pengunjung biasa tidak melihat tombol ini.") + '</p>'
        + '<button class="btn" data-act="toggle-edit">' + (editing ? "Selesai" : "Edit kalender") + '</button>'
        + (editing ? '<button class="btn" data-act="add">+ Tambah beasiswa</button>' : "")
        + (editing ? '<button class="btn" data-act="kontak">Kontak</button>' : "")
        + (editing ? '<button class="btn pri" data-act="salin">Salin data.json</button>' : "")
        + (editing ? '<button class="btn" data-act="unduh">Unduh</button>' : "")
        + '</div>';
    }
    if (toast) h += '<div class="toast ' + esc(toast.kind) + '">' + esc(toast.text) + '</div>';
    if (showJson) h += '<div class="jsonbox"><textarea id="jsonout" readonly spellcheck="false">'
      + esc(JSON.stringify(state, null, 2)) + '</textarea></div>';
    if (editing && formFor === "__new__") h += formHtml(null);
    if (editing && formFor === "__kontak__") h += kontakHtml();

    h += '<div class="views">'
      + '<button class="vbtn" aria-pressed="' + (view === "kalender") + '" data-view="kalender">Kalender</button>'
      + '<button class="vbtn" aria-pressed="' + (view === "daftar") + '" data-view="daftar">Daftar</button>'
      + '<button class="vbtn" aria-pressed="' + (view === "peta") + '" data-view="peta">Peta</button>'
      + '</div>';

    h += view === "peta" ? petaHtml() : (view === "kalender" ? calendarHtml(evs) : daftarHtml(items));
    h += penawaranHtml();

    var wa = state.kontak.wa ? String(state.kontak.wa).replace(/[^0-9]/g,"") : "";
    h += '<footer class="foot"><div class="foot-l"><h2>' + esc(state.kontak.nama) + '</h2>'
      + '<p>' + esc(state.kontak.catatan) + '</p></div><div class="contact">';
    if (state.kontak.ig) h += '<div class="cline">Instagram <b>@' + esc(state.kontak.ig) + '</b></div>';
    if (wa) {
      var pesan = (state.penawaran && state.penawaran.wa_pesan) ? "?text=" + encodeURIComponent(state.penawaran.wa_pesan) : "";
      h += '<div class="cline">WhatsApp <b>+' + esc(wa) + '</b></div>'
        + '<a class="lnk" href="https://wa.me/' + esc(wa) + esc(pesan) + '" target="_blank" rel="noopener">Buka chat WhatsApp</a>';
    } else if (canWrite) {
      h += '<div class="cline" style="color:var(--urgent)">Nomor WhatsApp belum diisi. Klik Edit kalender lalu Kontak.</div>';
    }
    h += '</div></footer>';

    h += '<p class="disc">Tanggal dan syarat bertanda <b>Perkiraan</b> belum diumumkan resmi untuk siklus ini dan disusun dari pola sebelumnya. '
      + 'Daftar syarat di halaman ini adalah ringkasan, bukan salinan resmi. Selalu buka situs penyelenggara sebelum mengandalkan apa pun di sini. '
      + 'Halaman ini bukan afiliasi resmi dari penyelenggara beasiswa mana pun.</p>';

    app.innerHTML = h;
  }

  function calendarHtml(evs){
    var first = new Date(Date.UTC(curY, curM, 1));
    var startDow = (first.getUTCDay() + 6) % 7;
    var dim = new Date(Date.UTC(curY, curM + 1, 0)).getUTCDate();
    var total = Math.ceil((startDow + dim) / 7) * 7;

    var h = '<div class="cal"><div class="calnav">'
      + '<h2>' + BULAN[curM] + " " + curY + '</h2>'
      + '<button class="nbtn" data-nav="-1" aria-label="Bulan sebelumnya">&#8249;</button>'
      + '<button class="nbtn wide" data-nav="0">Hari ini</button>'
      + '<button class="nbtn" data-nav="1" aria-label="Bulan berikutnya">&#8250;</button>'
      + '</div><div class="dow">';
    DOW.forEach(function(d){ h += "<span>" + d + "</span>"; });
    h += '</div><div class="grid7">';

    for (var i = 0; i < total; i++){
      var dnum = i - startDow + 1;
      if (dnum < 1 || dnum > dim) { h += '<div class="cell pad"></div>'; continue; }
      var iso = curY + "-" + pad(curM + 1) + "-" + pad(dnum);
      var list = evs[iso] || [];
      var cls = "cell";
      if (list.length) cls += " has";
      if (iso === TODAY) cls += " today";
      if (iso === selected) cls += " sel";
      if (i % 7 >= 5) cls += " wk";

      var inner = '<span class="dnum">' + dnum + "</span>", dots = "";
      list.slice(0, 3).forEach(function(e){
        var u = e.tipe === "buka" ? "nanti" : urgensi(e.it);
        var cls = "ev " + regionCls(e.it) + " u-" + u + (e.tipe === "buka" ? " buka" : "");
        inner += '<span class="' + cls + '">' + esc((e.tipe === "buka" ? "Buka " : "") + e.it.nama) + "</span>";
        dots += '<span class="' + cls + '" style="padding:0;border:0;background:none;color:var(--region)"><span class="dot"></span></span>';
      });
      if (list.length > 3) inner += '<span class="ev lebih">+' + (list.length - 3) + " lagi</span>";
      if (dots) inner += '<span class="dots">' + dots + "</span>";

      h += list.length
        ? '<button class="' + cls + '" data-date="' + iso + '">' + inner + "</button>"
        : '<div class="' + cls + '">' + inner + "</div>";
    }
    h += "</div>";

    var mset = {};
    Object.keys(evs).forEach(function(iso){ mset[iso.slice(0,7)] = (mset[iso.slice(0,7)] || 0) + evs[iso].length; });
    var keys = Object.keys(mset).sort();
    if (keys.length){
      h += '<div class="months"><b>Lompat ke</b>';
      keys.forEach(function(k){
        var y = parseInt(k.slice(0,4),10), m = parseInt(k.slice(5,7),10) - 1;
        h += '<button class="mjump" aria-pressed="' + (y === curY && m === curM) + '" data-jump="' + k + '">'
          + BLN_PENDEK[m] + " " + y + " (" + mset[k] + ")</button>";
      });
      h += "</div>";
    }

    var hadir = {};
    state.items.forEach(function(it){ hadir[it.region || "lain"] = 1; });
    var lg = "";
    REGIONS.forEach(function(r){ if (hadir[r[0]]) lg += '<span class="lg r-' + r[0] + '"><i></i>' + esc(r[1]) + "</span>"; });
    if (lg) h += '<div class="legend">' + lg + "</div>";
    h += "</div>";

    var sel = evs[selected] || [];
    h += '<section class="detail"><div class="dhead"><h3>' + esc(fmt(selected, "hari")) + "</h3>"
      + "<span>" + (sel.length ? sel.length + " agenda pada tanggal ini" : "tidak ada agenda") + "</span></div>";
    if (!sel.length) h += '<div class="empty">Klik tanggal yang bertanda di kalender untuk melihat syarat dan detailnya.</div>';
    else {
      h += '<div class="list">';
      sel.forEach(function(e){
        h += rowHtml(e.it, e.tipe);
        if (editing && formFor === e.it.id) h += formHtml(e.it);
      });
      h += "</div>";
    }
    return h + "</section>";
  }

  function daftarHtml(items){
    var shown = items.filter(function(i){
      var s = statusOf(i);
      if (filterStatus === "aktif" && s === "tutup") return false;
      if (filterStatus === "buka" && s !== "buka") return false;
      if (filterStatus === "nanti" && s !== "nanti") return false;
      if (filterStatus === "tutup" && s !== "tutup") return false;
      if (filterJenjang !== "semua" && (i.jenjang || []).indexOf(filterJenjang) === -1) return false;
      if (filterDana !== "semua" && i.tipe !== filterDana) return false;
      return true;
    });
    var h = '<div class="chips">'
      + chip("status","aktif","Aktif") + chip("status","buka","Dibuka")
      + chip("status","nanti","Belum buka") + chip("status","tutup","Sudah tutup")
      + chip("status","semua","Semua") + '<div class="sep"></div>'
      + chip("jenjang","semua","Semua jenjang") + chip("jenjang","S1","S1")
      + chip("jenjang","S2","S2") + chip("jenjang","S3","S3") + '<div class="sep"></div>'
      + chip("dana","semua","Semua dana") + chip("dana","penuh","Beasiswa penuh")
      + chip("dana","parsial","Parsial") + "</div>";
    h += '<div class="list">';
    if (!shown.length) h += '<div class="empty">Tidak ada beasiswa yang cocok dengan filter ini.</div>';
    else shown.forEach(function(it){
      h += rowHtml(it, "tutup");
      if (editing && formFor === it.id) h += formHtml(it);
    });
    return h + "</div>";
  }

  var REGIONS = [["uk","Inggris"],["eropa","Eropa"],["amerika","Amerika"],["oseania","Australia & NZ"],
                 ["asiatimur","Asia Timur"],["asiatenggara","Asia Tenggara"],["turki","Turki"],["indonesia","Indonesia"]];
  function regionCls(it){
    var r = it.region || "lain";
    for (var i = 0; i < REGIONS.length; i++) if (REGIONS[i][0] === r) return "r-" + r;
    return "r-lain";
  }

  function promoHtml(){
    var p = state.promo;
    if (!p || !p.aktif) return "";
    if (valid(p.sampai) && days(TODAY, p.sampai) < 0) return "";
    if (valid(p.mulai) && days(TODAY, p.mulai) > 0) return "";
    var sisa = valid(p.sampai) ? days(TODAY, p.sampai) : null;
    return '<div class="promo"><b>' + esc(p.judul) + "</b><span>" + esc(p.teks) + "</span>"
      + (sisa !== null ? '<span class="sisa">' + (sisa === 0 ? "berakhir hari ini" : "sisa " + sisa + " hari") + "</span>" : "")
      + "</div>";
  }

  function penawaranHtml(){
    var p = state.penawaran;
    if (!p) return "";
    var wa = String(state.kontak.wa || "").replace(/[^0-9]/g, "");
    var link = wa ? "https://wa.me/" + wa + (p.wa_pesan ? "?text=" + encodeURIComponent(p.wa_pesan) : "") : "";
    var judul = esc(p.judul).replace("IELTS 6.5+", "<em>IELTS 6.5+</em>");

    var h = '<section class="sell"><div class="sell-top"><h2>' + judul + "</h2>";
    if (p.sub) h += "<p>" + esc(p.sub) + "</p>";
    if (p.poin && p.poin.length){
      h += '<ul class="sell-poin">';
      p.poin.forEach(function(x){ h += "<li>" + esc(x) + "</li>"; });
      h += "</ul>";
    }
    if (p.demo) h += '<div><span class="demo">' + esc(p.demo) + "</span></div>";
    h += "</div>";

    if (p.paket && p.paket.length){
      h += '<div class="paket">';
      p.paket.forEach(function(k){
        var w = ["teal","lime","ungu"].indexOf(k.warna) > -1 ? k.warna : "teal";
        h += '<div class="pk ' + w + '"><div class="pk-h">' + esc(k.nama)
          + (k.unggulan ? '<span class="best">Terlaris</span>' : "") + "</div>"
          + '<div class="pk-harga"><b>' + esc(k.harga) + "</b>"

      g[k].total++;

    return Object.keys(g).sort(function(a,b){

  function petaHtml(){

    }).sort(function(a,b){ return b.total - a.total; });

    titik.forEach(function(n){
      var k = KOORD[n.negara];

  function slug(s){
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "beasiswa-" + Date.now();
  }
  function readForm(id){
    var jen = [];
    JENJANG.forEach(function(j){ var c = document.getElementById("f-j-" + j); if (c && c.checked) jen.push(j); });
    var nama = (document.getElementById("f-nama").value || "").trim();
    if (!nama){ toast = { kind:"bad", text:"Nama beasiswa tidak boleh kosong." }; return null; }
    var link = (document.getElementById("f-link").value || "").trim();
    if (link && !/^https:\/\//i.test(link)){ toast = { kind:"bad", text:"Link harus diawali https://" }; return null; }
    var syarat = (document.getElementById("f-syarat").value || "").split("\n")
      .map(function(x){ return x.trim(); }).filter(Boolean);
    return {
      id: id || slug(nama), nama: nama,
      org: (document.getElementById("f-org").value || "").trim(),
      negara: (document.getElementById("f-negara").value || "").trim(),
      region: document.getElementById("f-region").value,
      tipe: document.getElementById("f-tipe").value,

  function salinJson(){
    state.updated = todayISO();
    showJson = true;
    var txt = JSON.stringify(state, null, 2);
    var done = function(ok){
      toast = ok
        ? { kind:"good", text:"data.json tersalin. Buka repo GitHub, klik data.json, klik ikon pensil, pilih semua isinya, tempel, lalu Commit changes." }
        : { kind:"", text:"Tidak bisa menyalin otomatis. Pilih semua teks di kotak di bawah, salin manual, lalu tempel ke data.json di GitHub." };
      render();
      var ta = document.getElementById("jsonout");
      if (ta && !ok){ ta.focus(); ta.select(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
    } else done(false);
  }

  function unduhJson(){
    state.updated = todayISO();
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "data.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast = { kind:"good", text:"data.json terunduh. Unggah file ini menggantikan data.json di repo GitHub-mu." };
    render();
  }

  app.addEventListener("click", function(e){
    var cell = e.target.closest("[data-date]");
    if (cell){ selected = cell.dataset.date; render(); return; }

    var neg = e.target.closest("[data-neg]");
    if (neg){
      var v = neg.getAttribute("data-neg");
      mapNegara = (!v || mapNegara === v) ? null : v;
      render(); return;
    }

    var b = e.target.closest("button");
    if (!b) return;

    if (b.dataset.view){ view = b.dataset.view; toast = null; showJson = false; render(); return; }
    if (b.dataset.nav !== undefined){
      var d = parseInt(b.dataset.nav, 10);
      if (d === 0){ var t = new Date(); curY = t.getFullYear(); curM = t.getMonth(); }
      else { curM += d; if (curM < 0){ curM = 11; curY--; } if (curM > 11){ curM = 0; curY++; } }
      render(); return;
    }
    if (b.dataset.jump){
      curY = parseInt(b.dataset.jump.slice(0,4), 10);
      curM = parseInt(b.dataset.jump.slice(5,7), 10) - 1;
      render(); return;
    }
    if (b.dataset.filter){
      if (b.dataset.filter === "status") filterStatus = b.dataset.val;
      else if (b.dataset.filter === "jenjang") filterJenjang = b.dataset.val;
      else filterDana = b.dataset.val;
      render(); return;
    }

    var act = b.dataset.act;
    if (!act) return;
    toast = null;

    if (act === "toggle-edit"){ editing = !editing; formFor = null; showJson = false; render(); }
    else if (act === "add"){ formFor = "__new__"; render(); }
    else if (act === "edit"){ formFor = b.dataset.id; render(); }
    else if (act === "kontak"){ formFor = "__kontak__"; render(); }
    else if (act === "cancel"){ formFor = null; render(); }
    else if (act === "salin"){ salinJson(); }
    else if (act === "unduh"){ unduhJson(); }
    else if (act === "del"){
      var it = state.items.filter(function(x){ return x.id === b.dataset.id; })[0];
      if (!it) return;
      if (b.dataset.sure === "1"){
        state.items = state.items.filter(function(x){ return x.id !== b.dataset.id; });
        dirty = true; formFor = null;
        toast = { kind:"", text:'"' + it.nama + '" dihapus. Klik Salin data.json lalu tempel ke GitHub.' };
        render();
      } else { b.dataset.sure = "1"; b.textContent = "Yakin hapus?"; }
    }
    else if (act === "save"){
      var data = readForm(b.dataset.id);
      if (!data){ render(); return; }
      var idx = -1;
      state.items.forEach(function(x,i){ if (x.id === b.dataset.id) idx = i; });
      if (idx > -1) state.items[idx] = data; else state.items.push(data);
      dirty = true; formFor = null;
      toast = { kind:"", text:"Tersimpan sementara di browser ini. Klik Salin data.json lalu tempel ke GitHub supaya permanen." };
      render();
    }
    else if (act === "save-kontak"){
      state.kontak = {
        nama: (document.getElementById("k-nama").value || "").trim() || "Kalender Beasiswa",
        ig: (document.getElementById("k-ig").value || "").trim().replace(/^@/,""),
        wa: (document.getElementById("k-wa").value || "").replace(/[^0-9]/g,""),
        catatan: (document.getElementById("k-catatan").value || "").trim()
      };
      dirty = true; formFor = null;
      toast = { kind:"", text:"Kontak tersimpan sementara. Klik Salin data.json lalu tempel ke GitHub." };
      render();
    }
  });

  window.addEventListener("hashchange", function(){
    canWrite = location.hash.indexOf("edit") > -1;
    if (!canWrite){ editing = false; formFor = null; showJson = false; }
    render();
  });

  function gagal(pesan){
    app.innerHTML = '<div class="boot">' + esc(pesan) + "</div>";
  }

  fetch("data.json", { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){
      if (!d || !Array.isArray(d.items)) throw new Error("bentuk data salah");
      state = d;
      if (!state.kontak) state.kontak = { nama:"Kalender Beasiswa", ig:"", wa:"", catatan:"" };
      selected = defaultSelection();
      curY = parseInt(selected.slice(0,4), 10);
      curM = parseInt(selected.slice(5,7), 10) - 1;
      render();
    })
    .catch(function(err){
      gagal("Gagal memuat data.json (" + err.message + "). Kalau kamu membuka file ini langsung dari komputer, "
        + "jalankan lewat server lokal atau buka versi yang sudah di GitHub Pages.");
    });
})();
</script>
</body>
</html>
